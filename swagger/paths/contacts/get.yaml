tags:
  - Contacts
summary: Get contacts list
operationId: getContacts
description: Retrieve a list of all contacts with filtering and pagination options.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    description: Page number for pagination (default is 1)
    schema:
      type: integer
      format: int32
      minimum: 1
  - name: limit
    in: query
    required: false
    description: Number of contacts per page (default depends on server settings)
    schema:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
  - name: favourite
    in: query
    required: false
    description: Filter only favourite contacts (true/false)
    schema:
      type: boolean
  - name: contactType
    in: query
    required: false
    description: Filter contacts by type
    schema:
      type: string
      enum:
        - work
        - home
        - personal
responses:
  '200':
    description: Successful response - list of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                description: Contact ID
              name:
                type: string
                description: Contact name
              phoneNumber:
                type: string
                description: Contact phone number
              email:
                type: string
                format: email
                description: Contact email
              isFavourite:
                type: boolean
                description: Is the contact a favorite
              contactType:
                type: string
                enum:
                  - work
                  - home
                  - personal
                description: Contact type
              userId:
                type: string
                description: ID of the user who owns the contact
              photo:
                type: [string, 'null']
                description: Link to the contact's photo
              createdAt:
                type: string
                format: date-time
                description: Date when the contact was created
              updatedAt:
                type: string
                format: date-time
                description: Date when the contact was last updated
  '400':
    description: Bad request - Invalid query parameters
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Invalid value for parameter 'page'"