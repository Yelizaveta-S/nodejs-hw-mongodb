tags:
  - Contacts
summary: Get contacts list
operationId: getContacts
description: Retrieve a list of all contacts with filtering and pagination options.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    description: Page number for pagination (default is 1)
    schema:
      type: integer
      format: int32
      minimum: 1
  - name: perPage
    in: query
    required: false
    description: Number of contacts per page (default depends on server settings)
    schema:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
  - name: isFavourite
    in: query
    required: false
    description: Filter only favourite contacts (true/false)
    schema:
      type: boolean
  - name: contactType
    in: query
    required: false
    description: Filter contacts by type
    schema:
      type: string
      enum:
        - work
        - home
        - personal
responses:
  '200':
    description: Successful response - list of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/contact.yaml'
  '404':
    description: Bad request - Invalid query parameters
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Invalid value for parameter 'page'"