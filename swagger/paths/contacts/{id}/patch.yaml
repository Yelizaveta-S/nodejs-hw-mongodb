tags:
  - Contacts
summary: Update an existing contact
operationId: updateContact
description: Update information about an existing contact by their ID.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Unique identifier of the contact to update
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: New contact name
          phoneNumber:
            type: string
            description: New contact phone number
          email:
            type: string
            format: email
            description: New contact email
          isFavourite:
            type: boolean
            description: Set if the contact is a favorite
          contactType:
            type: string
            enum:
              - work
              - home
              - personal
            description: New contact type
          photo:
            type: [string, 'null']
            description: New link to the contact's photo
responses:
  '200':
    description: Successfully updated
    content:
      application/json:
        schema:
          type: object
          properties:
            _id:
              type: string
              description: ID of the updated contact
  '400':
    description: Bad request
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: 'Validation error'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: 'Not found'
  '500':
    description: Server error
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: 'Server error'