tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Retrieve details of a contact by their unique identifier.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Unique identifier of the contact
    schema:
      type: string
responses:
  '200':
    description: Successful response - contact details
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/contact.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Not found"
  '401':
    description: Unauthorized - Authentication required
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Authentication failed or token is invalid"