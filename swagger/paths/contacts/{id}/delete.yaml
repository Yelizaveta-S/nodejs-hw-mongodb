tags:
  - Contacts
summary: Delete an existing contact
operationId: deleteContact
description: Delete a contact by their unique identifier.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Unique identifier of the contact to delete
    schema:
      type: string
responses:
  '204':
    description: Successfully deleted (No Content)
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Not found"
  '500':
    description: Server error
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Server error"